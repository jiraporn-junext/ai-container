name: ai-container

services:
  claude-cli:
    build: .
    image: ai-container:local
    # Change these (with COMPOSE_PROJECT_NAME and OLLAMA_HOST_PORT) to run a
    # second instance alongside the first instead of replacing it.
    container_name: "${CONTAINER_NAME:-ai_container}"
    ports:
      # The container always listens on 11434; the host side is mapped to 11435 so
      # it does not collide with an Ollama you already run natively on your Mac.
      # Bound to 127.0.0.1 on purpose: Ollama's API has no authentication, and a
      # cloud model would spend your Ollama account's quota.
      - "127.0.0.1:${OLLAMA_HOST_PORT:-11435}:11434"

    # Memory cap for the container. 0 means no cap - the container can use
    # everything the Docker Desktop VM has been given. Set MEM_LIMIT in .env
    # (for example 8g) to put a ceiling on it.
    mem_limit: "${MEM_LIMIT:-0}"

    environment:
      # Model that gets pulled on first start and that Claude Code talks to
      OLLAMA_MODEL: "${OLLAMA_MODEL:-qwen3:1.7b}"

      # Ollama's default context window is only 4096 tokens, which is too small
      # for a coding agent's system prompt plus the code it is working on.
      OLLAMA_CONTEXT_LENGTH: "${OLLAMA_CONTEXT_LENGTH:-16384}"

      # Route Claude Code to the local Ollama instead of the Anthropic API.
      # Ollama speaks the Anthropic Messages API, including streaming and tool use.
      ANTHROPIC_BASE_URL: http://127.0.0.1:11434
      ANTHROPIC_AUTH_TOKEN: ollama
      ANTHROPIC_API_KEY: ollama
      ANTHROPIC_MODEL: "${OLLAMA_MODEL:-qwen3:1.7b}"
      ANTHROPIC_DEFAULT_OPUS_MODEL: "${OLLAMA_MODEL:-qwen3:1.7b}"
      ANTHROPIC_DEFAULT_SONNET_MODEL: "${OLLAMA_MODEL:-qwen3:1.7b}"
      ANTHROPIC_DEFAULT_HAIKU_MODEL: "${OLLAMA_MODEL:-qwen3:1.7b}"

      # Without this, Claude Code asks for the 1M-context variant and sends the
      # model name as "qwen3:1.7b[1m]", which Ollama rejects with a 400.
      CLAUDE_CODE_DISABLE_1M_CONTEXT: "1"

      # Git identity for commits made inside the container. The host's
      # ~/.gitconfig is deliberately not mounted, so the container has its own.
      GIT_AUTHOR_NAME: "${GIT_USER_NAME:-ai-container}"
      GIT_AUTHOR_EMAIL: "${GIT_USER_EMAIL:-ai-container@localhost}"
      GIT_COMMITTER_NAME: "${GIT_USER_NAME:-ai-container}"
      GIT_COMMITTER_EMAIL: "${GIT_USER_EMAIL:-ai-container@localhost}"
    volumes:
      # Explicitly mount your project workspace folder
      - "${WORKSPACE_PATH:-/Users/jirapornjohansson/workspace}:/home/workspace"

      # Persist Claude settings and tokens (Managed internally by Docker)
      - claude-config:/root/.claude

      # Persist NVM-installed Node versions (Managed internally by Docker)
      - nvm-data:/root/.nvm

      # Persist downloaded Ollama models (Managed internally by Docker)
      - ollama-models:/root/.ollama

    # Required parameters for interactive command typing
    stdin_open: true
    tty: true

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:11434/api/version"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  claude-config:
  nvm-data:
  ollama-models:
